name: Cyclic Imports
on:
  workflow_call:
  workflow_dispatch:  # to trigger manually

permissions:
  contents: read

jobs:
  cyclic-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup python environment
        uses: ./.github/actions/setup-env
        with:
          python-version: '3.12'

      - name: check astrotech
        run: |
          python -c "import astrotech"
      - name: check astrotech.utils
        run: |
          python -c "from astrotech import utils"
