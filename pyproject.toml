[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[project]
name = "astrotech"
version = "0.0.1a0"
description = "A configurable and extensible PyTorch training engine"
readme = "README.md"
authors = [{ name = "Thibaut Durand", email = "durand.tibo+gh@gmail.com" }]
keywords = ["training engine", "torch"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

requires-python = ">=3.11"
dependencies = [
  "coola>=0.9,<2.0",
  "iden>=0.2,<1.0",
  "karbonn>=0.0.4a0,<1.0",
  "minevent>=0.3,<1.0",
  "minrecord>=0.1,<1.0",
  "objectory>=0.2,<1.0",
  "torch>=2.10,<3.0; (sys_platform == 'linux' or (sys_platform == 'darwin' and platform_machine == 'arm64'))",
]

[project.optional-dependencies]
numpy = ["numpy>=2.0,<3.0"]
all = ["numpy>=2.0,<3.0"]

[dependency-groups]

dev = [
  "codespell>=2.4,<3.0",
  "coverage[toml]>=7.10,<8.0",
  "docformatter[tomli]>=1.7,<2.0",
  "feu[all]>=0.3.5,<1.0",
  "import-linter>=2.0,<3.0",
  "invoke-tasklib>=0.1.0a0,<1.0",
  "invoke>=3.0,<4.0",
  "pre-commit>=4.3,<5.0",
  "pygments>=2.20,<3.0",
  "pytest-cov>=7.1,<8.0",
  "pytest-timeout>=2.4,<3.0",
  "pytest>=8.4,<10.0",
  "ruff>=0.17,<1.0",
  "ty>=0.0.108,<1.0",
  "xdoctest>=1.3,<2.0",
]

docs = [
  "mike>=2.1,<3.0",
  "mkdocs-material>=9.7,<10.0",
  "mkdocstrings[python]>=0.30,<2.0",
]

[project.urls]
Homepage = "https://github.com/durandtibo/astrotech"
Repository = "https://github.com/durandtibo/astrotech"
Issues = "https://github.com/durandtibo/astrotech/issues"

[tool.uv]
# torch is only available on Linux and Apple Silicon.
environments = [
  "sys_platform == 'linux'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.pip]
torch-backend = "auto"

[tool.codespell]
skip = "*.lock,./.git,./htmlcov,./docs/site,coverage.xml"

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["astrotech"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:"
]

[tool.pytest.ini_options]
testpaths = ["tests/"]
log_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
log_level = "DEBUG"
minversion = "8.0"
addopts = ["--color", "yes", "--durations", "10", "-rf", "--strict-markers", "--strict-config"]
xfail_strict = true
timeout = 300
# Configuration of the short test summary info
# https://docs.pytest.org/en/stable/usage.html#detailed-summary-report

[tool.docformatter]
recursive = true
wrap-summaries = 72
wrap-descriptions = 72
syntax = "google"

[tool.ruff]
# List of rules: https://docs.astral.sh/ruff/rules/
lint.select = [
    "A", # builtins
    "ANN", # annotations
    "ARG", # flake8-unused-arguments
    "B", # bugbear
    "BLE", # flake8-blind-except
    "C4", # flake8-comprehensions
    "C90", # mccabe complexity
    "D", # pydocstyle
    "DTZ", # flake8-datetimez
    "E", # pycodestyle (Error)
    "EM", # flake8-errmsg
    "EXE", # flake8-executable
    "F", # pyflakes
    "FA", # flake8-future-annotations
    "FURB", # refurb
    "G", # flake8-logging-format
    "I", # isort
    "ICN", # flake8-import-conventions
    "INP", # flake8-no-pep420
    "ISC", # flake8-implicit-str-concat
    "LOG", # logging
    "N", # naming
    "NPY", # NumPy-specific rules
    "PD", # pandas-vet
    "PERF", # Perflint
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PL", # Pylint
    "PT", # flake8-pytest-style
    "PTH", # pathlib
    "PYI", # flake8-pyi
    "Q", # flake8-quotes
    "RET", # flake8-return
    "RSE", # flake8-raise
    "RUF", # Ruff-specific rules
    "S", # flake8-bandit
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "TC", # flake8-type-checking
    "TD", # flake8-todos
    "TID", # flake8-tidy-imports
    "TRY", # tryceratops
    "UP", # pyupgrade
    "W", # pycodestyle (Warning)
]
lint.ignore = [
    "A003", # Class attribute `{name}` is shadowing a python builtin
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed.
    "E501", # Line lengths are recommended to be no greater than 79 characters.
    "W505", # Doc line too long
    "PLR0913", # Too many arguments in function definition (8 > 5)
    "PLR0917", # Too many positional arguments
    "PLR2004", # Magic value used in comparison, consider replacing 0.0 with a constant variable

    # The following rules are ignored because they conflict with another library like docformatter.
    "D102", # Missing docstring in public method
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in `__init__`
    "D205", # 1 blank line required between summary line and description
    "D209", # Multi-line docstring closing quotes should be on a separate line
]

lint.exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Enable on top of the Google convention.
lint.extend-select = ["D400", "D401", "D404"]

line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint.per-file-ignores]
# Ignore all directories named `tests`.
"tests/**" = [
    "D", # pydocstyle
    "PL", # Pylint
    "S101", # flake8-bandit
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.isort]
force-sort-within-sections = false
combine-as-imports = true
known-first-party = ["astrotech"]

[tool.ruff.lint.flake8-import-conventions]
[tool.ruff.lint.flake8-import-conventions.aliases]
numpy = "np"

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python-version = "3.11"

[tool.importlinter]
root_package = "astrotech"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Utils must not import the model or the engine packages"
type = "forbidden"
source_modules = ["astrotech.utils"]
forbidden_modules = ["astrotech.model", "astrotech.engine"]

[[tool.importlinter.contracts]]
name = "Model and engine packages must be independent"
type = "independence"
modules = ["astrotech.model", "astrotech.engine"]
